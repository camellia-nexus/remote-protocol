name: Apply Gemini PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    name: Apply Gemini PR to main
    if: startsWith(github.head_ref, 'gemini/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Merge Gemini PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "Applying PR $PR_URL (branch: $HEAD_REF) into main..."
          gh pr merge "$PR_URL" --merge || gh pr merge "$PR_URL" --auto --merge || gh pr merge "$PR_URL" --admin --merge
